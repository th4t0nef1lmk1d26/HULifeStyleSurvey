    <h1>HU Lifestyle Survey</h1>   

    <div style="width: 1000px; max-width: 100%;">
        <canvas id="EventPie"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
    //chart2
    const ctx2 = document.getElementById('EventPie').getContext('2d')
    const data2 = {
        labels: ['Red', 'Blue', 'Yellow', 'Green', 'Purple', 'Orange'],
        datasets: [{
            label: '# of Votes',
            data: [12, 19, 3, 5, 2, 3],
        }]
    }
    const options2 = {
        scales: {
            y: {
                beginAtZero: true
            }
        }
    }

    const EventPie = new Chart(ctx2, {
    type: 'line',
    data: data2,
    options: options2
    })
    </script>

</body>
