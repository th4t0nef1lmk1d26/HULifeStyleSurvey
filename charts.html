<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

</head>
<body>

    <header>
        <h3><a href="index.html">Home Page</a> - <a href="analysis.html">Analysis Page</a> - <a href="charts.html">Charts Page</a> - <a href="results.html">Results Page</a></h3>

    <h1>HU Lifestyle Survey</h1>   

    <h2 style="text-align: center;">Stepcount Across Different Halls</h2>
    <div style="width: 1000px; max-width: 75%; margin: auto;">
        <canvas id="StepBar"></canvas>
    </div>
	
    <h2 style="text-align: center;">Wright Hall: Event Participation</h2>

	<div style="width: 750px; max-width: 75%; margin: auto;">
        <canvas id="EventPie"></canvas>
    </div>

    <h2 style="text-align: center;">Baker Hall: Event Participation</h2>

	<div style="width: 750px; max-width: 75%; margin: auto;">
        <canvas id="EventPie2"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
    const ctx = document.getElementById('StepBar');

    new Chart(ctx, {
        type: 'bar',
        data: {
        labels: ['Baker', 'Roush', 'Miller/Meadows', 'Wright', 'Hardy', 'Livingston', 'Commuters'],
        datasets: [
			{
            label: 'Average Steps',
            data: [7400, 6062.5, 9177.5, 8925.21, 13500, 5000, 9320],
            borderWidth: 1,
			stack: 'Stack 0',
			},
			{
			label: 'Min',
            data: [3500, 3000, 8355, 2000, 10000, 2000, 5600],
            borderWidth: 1,
			stack: 'Stack 1',
			},
            {
			label: 'Max',
            data: [13000, 10000, 10000, 25000, 17000, 10000, 14000],
            borderWidth: 1,
			stack: 'Stack 2',
			}
		
		]
        },
    });
    </script>

    <script>
    //chart2
    const ctx2 = document.getElementById('EventPie').getContext('2d')
    const data2 = {
        labels: ['I attend every event!', 'I attend most events.', 'I pick and choose my events.', 'I don\'t often attend events.'],
        datasets: [{
            label: '# of Students',
            data: [5, 6, 1, 2],
        }]
    }
    const options2 = {
        }

    const EventPie = new Chart(ctx2, {
    type: 'doughnut',
    data: data2,
    options: options2
    })
    </script>


    <script>
    //chart3
    const ctx3 = document.getElementById('EventPie2').getContext('2d')
    const data3 = {
        labels: ['I attend every event!', 'I attend most events.', 'I pick and choose my events.', 'I don\'t often attend events.'],
        datasets: [{
            label: '# of Students',
            data: [1, 5, 0, 1],
        }]
    }
    const options3 = {
        }

    const EventPie2 = new Chart(ctx3, {
    type: 'doughnut',
    data: data3,
    options: options3
    })
    </script>
</body>
